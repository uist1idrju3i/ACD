name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm schema:validate
      - run: pnpm typegen-sync

  kicad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify pinned KiCad image
        run: |
          docker pull kicad/kicad:10.0
          test "$(docker image inspect kicad/kicad:10.0 --format '{{index .RepoDigests 0}}')" = \
            "kicad/kicad@sha256:182c8005cb775a2c448a4c18681d489f1ff472a761885eba3e08b07e3c0564de"
      - name: Run KiCad spike
        run: |
          set +e
          bash -x scripts/kicad-spike.sh
          status=$?
          echo "KiCad spike exit status: $status"
          find artifacts/kicad -maxdepth 3 -type f -print 2>/dev/null | sort || true
          for report in artifacts/kicad/reports/*; do
            [ -f "$report" ] && { echo "=== $report ==="; head -20 "$report"; }
          done
          exit "$status"
